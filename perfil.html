<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Jogador - Wime</title>
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button type="button" onclick="history.back()" class="btn-voltar-top">
        <span class="arrow">←</span>
        <span>Voltar à Partida</span>
      </button>
      <div class="logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">Wime</span>
      </div>
    </div>

    <div class="user-profile">
      <span class="user-name">Nome do Usuário</span>
      <div class="profile-avatar">
        <span class="avatar-placeholder">U</span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="profile-container">
    <section class="profile-card">
      <div class="profile-banner"></div>
      <div class="profile-body">
        <div class="big-avatar" id="playerBigAvatar">L</div>
        <h1 id="playerName">Lucas Mendes</h1>
        <p class="player-bio" id="playerBio">Jogador frequente de society e futevôlei nos finais de semana.</p>

        <div class="stats-row">
          <div class="stat-box">
            <strong id="playerLevel">Intermediário</strong>
            <span>Nível Geral</span>
          </div>
          <div class="stat-box">
            <strong id="playerMatches">24</strong>
            <span>Partidas Jogadas</span>
          </div>
          <div class="stat-box">
            <strong id="playerReputation">98%</strong>
            <span>Presença</span>
          </div>
        </div>

        <div class="interests-section">
          <h3>🏅 Esportes de Interesse</h3>
          <div class="tags-list" id="playerSportsTags"></div>
        </div>

        <div class="profile-footer-actions">
          <button type="button" onclick="history.back()" class="btn-back-match">Voltar para a Sala</button>
          <a href="denuncia.html" class="btn-report-user">🚨 Denunciar Perfil</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/perfil.js"></script>
</body>
</html>
